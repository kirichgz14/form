<div class="page-container">
  <!-- Левая колонка с картинкой и логотипом -->
  <div class="sidebar">
    <div class="logo-box">
      <img src="odin-lined.png" alt="Logo">
      <span>ODIN</span>
    </div>
    <div class="photo-credit">Photo by Halie West on Unsplash</div>
  </div>

  <!-- Правая колонка с формой -->
  <div class="form-container">
    <p><strong>This is not a real online service! You know you need something
        like this in your life to help you realize your deepest dreams.
        sign up <em>now</em> to get started.
    </strong></p>
    <p>You <em>know</em> you want to</p>
    <!-- Текст и инпуты -->
    <p><strong>Let's do this</strong></p> 
    <form>
    <div class="allForm">
       <div class="form-row">
        <div class="firstName">
        <label for="fname">first name</label>
        <input id="fname" name="fname" type="text" required>
        </div>
        <div class="lastName">
            <label for="lname">Last name</label>
            <input id="lname" name="lname" type="text" required>
       </div>
        </div>
      <div class="form-row1">
       <div class="Email">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" required>
            </div>
            <div class="phoneNumber">
                <label for="phoneNum">Phone number</label>
                <input id="phoneNum" name="phoneNum" type="tel" required>
            </div>
        </div>
        <div class="form-row">
            <div class="passwd">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" required>
            </div>
            <div class="confirmPasswd">
            <label for="confpassword">Confirm password</label>
            <input id="confpassword" name="confpassword" type="password" required>
            </div>
        </div>
        <div class="button">
            <button type="submit">Create Account</button>
        </div>
        <p>Already have an account? <a>Log in</a></p>
        </div>
    </form>
  </div>
</div>
</body>
</html>
